name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk CursaHUD.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CursaHUD
          path: CursaHUD.apk

      - name: Publish release "latest"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Cursa HUD (ultima versiune)
          body: "Build #${{ github.run_number }} — descarcă CursaHUD.apk de mai jos și instalează-l pe telefon."
          files: CursaHUD.apk
          make_latest: true
